name: Advanced CI — Matrix Builds

on:
  push:
    branches: [ main ]
    paths:
      - 'Day-15/**'
      - '.github/workflows/ci-advanced.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Day-15/**'
      - '.github/workflows/ci-advanced.yml'
  workflow_dispatch:

jobs:
  test-matrix:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'Day-15/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          cd Day-15
          python -m pytest test_devops.py -v

      - name: Write job summary
        run: |
          echo "## ✅ Python ${{ matrix.python-version }} passed" >> $GITHUB_STEP_SUMMARY
